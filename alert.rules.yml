groups:
- name: example
  rules:
  - alert: HighRequestLatency
    expr: http_request_latency_seconds{endpoint="/"} > 0.5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "طلبات بطيئة على الموقع الرئيسي"
      description: "زمن الاستجابة للموقع الرئيسي تجاوز 0.5 ثانية"

  - alert: ServiceDown
    expr: up{job="web-application"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "الخدمة غير متاحة"
      description: "تطبيق الويب غير مستجيب"